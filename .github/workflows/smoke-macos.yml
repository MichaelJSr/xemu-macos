name: macOS launch smoke

on:
  workflow_call:

jobs:
  smoke:
    # The release bundle links against the macOS 26 SDK with a 14.0 floor:
    # a symbol newer than the floor that isn't weak-linked fails here at
    # launch, on the oldest arm64 macOS GitHub still offers and on Intel.
    # macos-14 runners were retired in November 2026, so 14 itself goes
    # untested. ci.yml calls this after build.yml, beside Roswell, so
    # Roswell doesn't wait for it; release runs call it from
    # build-macos.yml (smoke: true) right after the Universal bundle.
    name: Launch on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    steps:
    - name: Download Universal bundle
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v4
      with:
        name: xemu-macos-universal-release
    - name: Launch
      run: |
        unzip -q xemu-*-macos-universal-unsigned.zip -d bundle
        d=$(mktemp -d)
        touch "$d/xemu.toml"
        XEMU_BASE_PATH="$d" XEMU_HEADLESS=null \
          bundle/xemu.app/Contents/MacOS/xemu -config_path "$d/xemu.toml" --version | tee out.txt
        grep -q 'QEMU emulator version' out.txt

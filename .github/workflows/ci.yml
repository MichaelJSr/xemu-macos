name: CI

on:
  pull_request:
  # Upstream skips master here because its prerelease job builds it; that
  # job only runs for xemu-project, so the fork's master builds here. A
  # push filter with only tags-ignore would skip every branch push.
  push:
    branches:
      - '**'
    tags-ignore:
      - "v*"
      # Dependency prereleases (kosmickrisp-asset.yml) and archive tags.
      - "kosmickrisp-*"
      - "archive/*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}

  roswell:
    name: Roswell tests
    needs: build
    # The fork's workflow, pinned by commit: upstream's (113add3, tag wheel-202610182103) with
    # Linux taking ffmpeg from apt, since setup-ffmpeg's download fails at times, and a Windows
    # hard-FPU leg (upstream's x86_64 legs run --no-hard-fpu, so nothing else runs the host x87
    # ops, tcg/i386 x87_*; its filter failure_filters/windows_roswell_hardfpu.json came from an
    # x86_64 macOS build under Rosetta 2: regenerate it from that leg's results.json if a
    # TestFloat ISO update or a real CPU disagrees). Upstream rotates its wheel-* tags and
    # deletes the old ones, and a deleted ref fails every run at startup. The workflow checks
    # out xemu_test_repository at xemu_test_ref, not its own commit.
    uses: MichaelJSr/xemu-test/.github/workflows/test-roswell.yml@184f197617014afae34a1bbe76d1f9de739599f9
    with:
      xemu_build_configuration: release
      # Test sources from the fork's branch: macos_roswell.json also expects the arm64 hard FPU's TestFloat failures.
      xemu_test_repository: MichaelJSr/xemu-test
      xemu_test_ref: xemu-macos

name: CI

on:
  pull_request:
  # Upstream skips master here because its prerelease job builds it; that
  # job only runs for xemu-project, so the fork's master builds here. A
  # push filter with only tags-ignore would skip every branch push.
  push:
    branches:
      - '**'
    tags-ignore:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ github.ref }}

  roswell:
    name: Roswell tests
    needs: build
    # Pinned by commit (tag wheel-202610182103): upstream rotates its wheel-* tags and deletes
    # the old ones, and a deleted ref fails every run at startup. The workflow checks out
    # xemu_test_repository at xemu_test_ref and never its own tag.
    uses: xemu-project/xemu-test/.github/workflows/test-roswell.yml@113add3d76dfe703944df97a804d1a1751aba234
    with:
      xemu_build_configuration: release
      # Test sources from the fork's branch: macos_roswell.json also expects the arm64 hard FPU's TestFloat failures.
      xemu_test_repository: MichaelJSr/xemu-test
      xemu_test_ref: xemu-macos

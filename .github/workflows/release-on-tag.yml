name: Release (Tag Pushed)

on:
  push:
    tags: ['v*']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    # Allow this fork's owner in addition to upstream, otherwise tag
    # pushes on the fork never produce a release.
    if: contains(fromJSON('["xemu-project", "MichaelJSr"]'), github.repository_owner)
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}

name: Build for macOS

on:
  workflow_call:
    inputs:
      pkg_version:
        description: Build version
        required: true
        type: string

jobs:
  build:
    name: Build for macOS (${{ matrix.arch }}, ${{ matrix.configuration }})
    runs-on: macos-15
    strategy:
      matrix:
        arch: [x86_64, arm64]
        configuration: [debug, release]
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_INSTALL_CLEANUP: 1
      CCACHE_DIR: ${{ github.workspace }}/xemu-ccache
      CCACHE_MAXSIZE: 512M
      LTO_CACHE_DIR: ${{ github.workspace }}/xemu-lto-cache
    steps:
    - name: Download source package
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        name: src
    - name: Extract source package
      run: tar -xf xemu-${{ inputs.pkg_version }}.tar.zst --strip-components=2
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        brew install \
          ccache \
          coreutils \
          dylibbundler
        pip install pyyaml requests
    - name: Initialize compiler, library cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
      with:
        path: |
          macos-pkgs
          ${{ env.CCACHE_DIR }}
          ${{ env.LTO_CACHE_DIR }}
        key: cache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-${{ github.sha }}
        restore-keys: cache-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.configuration }}-
    - name: Setup ccache
      run: |
        echo "PATH=/opt/homebrew/opt/ccache/libexec:$PATH" >> "$GITHUB_ENV"
        mkdir -p ${CCACHE_DIR}
        ccache -z
    - name: Setup build options
      run: |
        if [[ "${{ matrix.configuration }}" == "debug" ]]; then
          opts=(
            --debug
          )
        else
          opts=(
            -Db_lto=true
            -Db_lto_mode=thin
            -Db_thinlto_cache=true
            -Db_thinlto_cache_dir="$LTO_CACHE_DIR"
            -Dx86_version=3
          )
          mkdir -p ${LTO_CACHE_DIR}
        fi
        echo "XEMU_BUILD_OPTIONS=${opts[*]}" >> "$GITHUB_ENV"
        # Distribution ISA floor. build.sh's -mcpu auto-detect follows
        # the build host, so a GitHub runner-silicon refresh would
        # silently raise the baseline above the apple-m1 floor the
        # README advertises — SIGILL on launch for M1 users, with no CI
        # signal. Pin it here; build.sh ignores it on the x86_64 leg.
        # (apple-m1 vs apple-m2 codegen was measured nil on this tree,
        # so this costs nothing today; it is a guard, not a tuning.)
        echo "XEMU_ARM_CPU=apple-m1" >> "$GITHUB_ENV"
        echo "ISA floor: XEMU_ARM_CPU=apple-m1"
        # Single home for the expected MoltenVK version: build.sh's own
        # vendoring default. The packaged bundle's provenance line is
        # asserted against it after the build, so a system/Homebrew
        # dylib shadowing the vendored release fails the job instead of
        # shipping a driver nothing was validated against.
        mvk_expected=$(awk -F'XEMU_MOLTENVK_VERSION:-' \
          '/XEMU_MOLTENVK_VERSION:-/ { split($2, a, "}"); print a[1]; exit }' \
          build.sh)
        if [[ -z "$mvk_expected" ]]; then
          echo "::error::could not derive the XEMU_MOLTENVK_VERSION default from build.sh"
          exit 1
        fi
        echo "MVK_EXPECTED=${mvk_expected}" >> "$GITHUB_ENV"
        echo "MoltenVK expected version: ${mvk_expected}"
        # arm64 release builds use the committed PGO profile
        # (pgo/default.profdata, trained on the Azurik savestate corpus;
        # measured +9.4% fps on the heavy scene). Profiles are
        # arch-specific IR-hash matches, so x86_64 stays plain; a stale
        # profile degrades gracefully to partial coverage. build.sh
        # hard-fails if XEMU_PGO=use is set and the profile is missing.
        if [[ "${{ matrix.configuration }}" == "release" && "${{ matrix.arch }}" == "arm64" ]]; then
          echo "XEMU_PGO=use" >> "$GITHUB_ENV"
        fi
    - name: Compile
      # Teed to a file so the packaging-time MoltenVK provenance line
      # (printed by package_macos, after make's own build.log tee ends)
      # survives for the assertion below. `set -o pipefail` is
      # mandatory here: without it the tee's exit status would mask a
      # failed build.
      run: |
        set -o pipefail
        ./build.sh -a ${{ matrix.arch }} ${XEMU_BUILD_OPTIONS} 2>&1 | tee compile.log
    - name: Assert bundled MoltenVK version
      # build.sh's tier walk (vendored -> /usr/local -> Homebrew) means
      # a stray system install can shadow the vendored release, and
      # driver drift between the tested binary and the released binary
      # is exactly the channel the pink-tile class escaped through.
      # awk reads the whole log — no early-exit reader to trip pipefail.
      run: |
        got=$(awk '/^Bundling MoltenVK from /{ if (match($0, /\(version [^,]+,/)) v = substr($0, RSTART + 9, RLENGTH - 10) } END { print v }' compile.log)
        echo "bundled MoltenVK: '${got}' (expected '${MVK_EXPECTED}')"
        if [[ -z "$got" ]]; then
          echo "::error::no 'Bundling MoltenVK' provenance line in the build log"
          exit 1
        fi
        if [[ "$got" != "$MVK_EXPECTED" ]]; then
          echo "::error::bundled MoltenVK ${got} does not match the expected ${MVK_EXPECTED}"
          exit 1
        fi
    - name: Run xbox test suite
      # arm64 legs only: macos-15 runners are arm64-native, so only the
      # arm64 build's test binaries execute natively (the x86_64 leg is a
      # cross-build), and the DSP JIT differential arms are aarch64-only
      # anyway (DSP56K_JIT_SUPPORTED). Covers: the restored DSP unit test,
      # the swizzle round-trip, the interpreter golden corpus, and the
      # three inline-JIT differential arms (goldens-through-JIT with an
      # engagement assert, in-engine per-block bit-exact DIFF, and the
      # cross-process final-state byte compare). Runs in seconds; no game
      # content. `ninja test-xbox` builds exactly the xbox test
      # executables; --no-rebuild stops meson from building the rest of
      # the QEMU test universe.
      #
      # The Linux legs could run the same suite (the tests are portable;
      # the ubuntu-*-arm runner would even exercise the JIT arms), but
      # that build goes through dpkg-buildpackage with no accessible
      # meson build directory — wiring it is a separate change.
      if: matrix.arch == 'arm64'
      run: |
        cd build
        ninja test-xbox
        ./pyvenv/bin/meson test --suite xbox --print-errorlogs --no-rebuild
    - name: Report ccache stats
      run: ccache -s
    - name: Package
      id: package
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        pkg_filename="xemu-${VERSION}-macos-${{ matrix.arch }}-unsigned.zip"
        echo "pkg_filename=${pkg_filename}" >> $GITHUB_OUTPUT

        pushd dist
        zip -r ../${pkg_filename} *
        popd
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-macos-${{ matrix.arch }}-${{ matrix.configuration }}
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0

  build_universal:
    name: Build macOS Universal bundle (${{ matrix.configuration }})
    runs-on: macos-15
    needs: build
    strategy:
      matrix:
        configuration: [debug, release]
    steps:
    - name: Download architecture-specific builds
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v4
      with:
        pattern: "xemu-macos-*-${{ matrix.configuration }}"
        merge-multiple: true
    - name: Build Universal bundle
      run: |
        mkdir dist
        pushd dist
        for arch in x86_64 arm64; do
          unzip -o ../xemu-*-${arch}-unsigned.zip
          mv xemu.app/Contents/MacOS/xemu ../xemu_${arch}
        done
        lipo -create -output xemu.app/Contents/MacOS/xemu ../xemu_x86_64 ../xemu_arm64
        codesign --force --deep --preserve-metadata=entitlements,requirements,flags,runtime --sign - xemu.app/Contents/MacOS/xemu
        popd
    - name: Package
      id: package
      env:
        VERSION: ${{ inputs.pkg_version }}${{ matrix.configuration == 'debug' && '-dbg' || '' }}
      run: |
        pkg_filename="xemu-${VERSION}-macos-universal-unsigned.zip"
        echo "pkg_filename=${pkg_filename}" >> $GITHUB_OUTPUT
        pushd dist
        zip -r ../${pkg_filename} *
        popd
    - name: Upload build artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4
      with:
        name: xemu-macos-universal-${{ matrix.configuration }}
        path: ${{ steps.package.outputs.pkg_filename }}
        compression-level: 0
